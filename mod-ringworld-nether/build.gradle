plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.barttolo.ringworldnether'
version = project.mod_version
base { archivesName = 'RingWorld-Nether-Forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { ringworld_nether { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { ringworld_nether { source sourceSets.main } } }
    }
}

repositories {
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files('libs/ringworld-original.jar')
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

jar {
    manifest {
        attributes(['Specification-Title':'RingWorld Nether (separate add-on)',
                    'Implementation-Version':project.version,
                    'MixinConfigs':'ringworld_nether.mixins.json'])
    }
}
jar.finalizedBy('reobfJar')
